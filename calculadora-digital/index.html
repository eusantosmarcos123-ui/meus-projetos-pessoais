<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Dark Pro</title>
    <style>
        /* Reset e Base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000000;
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Container Principal */
        .app-container {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 
                        0 0 20px rgba(128, 0, 128, 0.3);
            border: 1px solid rgba(128, 0, 128, 0.5);
            width: 330px;
        }

        /* Relógio Digital */
        #clock {
            text-align: center;
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #800080;
            font-variant-numeric: tabular-nums;
        }

        /* Tela da Calculadora */
        #display {
            width: 100%;
            height: 70px;
            background: #000000;
            border: 2px solid #333;
            border-radius: 12px;
            margin-bottom: 20px;
            color: #ff0000;
            text-align: right;
            padding: 10px 15px;
            font-size: 2.2rem;
            outline: none;
            box-shadow: inset 0 0 15px rgba(255, 0, 0, 0.1);
            font-family: 'Consolas', monospace;
        }

        /* Teclado */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 60px;
            border-radius: 12px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button:hover {
            background: #ffffff !important;
            color: #000000 !important;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
        }

        /* Cores Especiais */
        .operator {
            background: #4106cc;
            border-color: #180bd1;
        }

        .clear {
            background: #000000;
            border-color: #ffffff;
        }

        .equal {
            background: #04ec9f;
            color: #000000;
            grid-column: span 2;
        }

        .zero {
            grid-column: span 2;
            background: #333;   
        }

        button:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body>

<div class="app-container">
    <div id="clock">00:00:00</div>
    <input type="text" id="display" disabled placeholder="0">
    
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="operator" onclick="appendToDisplay('/')">÷</button>
        <button class="operator" onclick="appendToDisplay('*')">×</button>
        <button class="clear" onclick="deleteLast()">⌫</button>

         <button onclick="appendToDisplay('1')">1</button>
        <button onclick="appendToDisplay('2')">2</button>
        <button onclick="appendToDisplay('3')">3</button>

        <button class="operator" onclick="appendToDisplay('+')">+</button>

        <button onclick="appendToDisplay('4')">4</button>
        <button onclick="appendToDisplay('5')">5</button>
        <button onclick="appendToDisplay('6')">6</button>

         <button class="operator" onclick="appendToDisplay('-')">-</button>
        
        <button onclick="appendToDisplay('7')">7</button>
        <button onclick="appendToDisplay('8')">8</button>
        <button onclick="appendToDisplay('9')">9</button>
         <button onclick="appendToDisplay('.')">.</button>


        <button class="zero" onclick="appendToDisplay('0')">0</button>
        <button class="equal" onclick="calculate()">=</button>
        
    </div>
</div>

<script>
    // Relógio Digital de Alta Precisão
    function updateClock() {
        const now = new Date();
        const timeString = now.toLocaleTimeString('pt-BR', { 
            hour12: false, 
            hour: '2-digit', 
            minute: '2-digit', 
            second: '2-digit' 
        });
        document.getElementById('clock').textContent = timeString;
    }
    
    setInterval(updateClock, 1000);
    updateClock();

    // Lógica da Calculadora
    const display = document.getElementById('display');

    function appendToDisplay(val) {
        // Limpa o "Erro" se o usuário começar a digitar de novo
        if (display.value === "Erro") display.value = "";
        display.value += val;
    }

    function clearDisplay() {
        display.value = "";
    }

    function deleteLast() {
        display.value = display.value.slice(0, -1);
    }

    function calculate() {
        try {
            if (display.value.trim() !== "") {
                // O uso de Function() é uma alternativa levemente mais segura que eval()
                const result = new Function('return ' + display.value)();
                display.value = Number.isFinite(result) ? result : "Erro";
            }
        } catch (e) {
            display.value = "Erro";
            setTimeout(clearDisplay, 1500);
        }
    }
</script>

</body>
</html>
