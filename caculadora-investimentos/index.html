<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de Juros Compostos Pro</title>
    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(-45deg, #000000, #1a1a2e, #000000, #4b5320);
        background-size: 400% 400%;
        animation: gradient 15s ease infinite;
        color: white;
      }

      @keyframes gradient {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .container {
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(20px);
        padding: 30px;
        border-radius: 25px;
        border: 1px solid #800080;
        width: 420px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }

      h2 {
        text-align: center;
        color: #800080;
        margin-top: 0;
      }

      .input-group {
        margin-bottom: 15px;
        flex: 1;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-size: 0.9rem;
        color: #ccc;
      }

      input,
      select {
        width: 100%;
        padding: 12px;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 8px;
        color: #fff;
        font-size: 1rem;
        box-sizing: border-box;
        outline: none;
      }

      input:focus,
      select:focus {
        border-color: #800080;
      }

      /* Estilização para os campos lado a lado */
      .flex-row {
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }

      .small-select {
        flex: 0 0 110px; /* Largura fixa para os selects menores */
      }

      .info-text {
        font-size: 0.75rem;
        color: #888;
        margin-top: 5px;
        font-style: italic;
        line-height: 1.2;
      }

      .row {
        display: flex;
        gap: 15px;
      }

      .btn-group {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }

      button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      .btn-calc {
        background: #800080;
        color: white;
      }
      .btn-calc:hover {
        background: #a000a0;
      }

      .btn-clear {
        background: #444;
        color: white;
      }
      .btn-clear:hover {
        background: #666;
      }

      #result {
        margin-top: 20px;
        padding: 15px;
        background: rgba(128, 0, 128, 0.1);
        border-radius: 10px;
        text-align: center;
        display: none;
        border: 1px solid rgba(128, 0, 128, 0.3);
      }

      .res-val {
        color: #00ff00;
        font-size: 1.5rem;
        font-weight: bold;
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Investimento Pro</h2>
      <h6>
        Calcule seu investimento com juros compostos e visualize o
        crescimento!!!
      </h6>

      <div class="input-group">
        <label>Valor Inicial (R$)</label>
        <input type="number" id="inicial" placeholder="Ex: 1000" />
      </div>

      <div class="row">
        <div class="input-group">
          <label>Taxa de Juros (%)</label>
          <div class="flex-row">
            <input type="number" id="juros" placeholder="12" />
            <select id="tipoJuros" class="small-select">
              <option value="anual">Anual</option>
              <option value="mensal">Mensal</option>
              <option value="diario">Diário</option>
            </select>
          </div>
        </div>
      </div>

      <div class="input-group">
        <label>Inflação Anual (%)</label>
        <input type="number" id="inflacao" placeholder="Ex: 5" />
      </div>

      <div class="input-group">
        <label>Aporte Mensal (R$)</label>
        <input type="number" id="aporte" placeholder="Ex: 200" />
        <p class="info-text">
          Se informado, o aporte mensal será corrigido pela inflação a cada mês.
        </p>
      </div>

      <div class="input-group">
        <label>Tempo de Investimento</label>
        <div class="flex-row">
          <input type="number" id="tempo" value="1" min="1" />
          <select id="tipoTempo" class="small-select">
            <option value="anos">Ano(s)</option>
            <option value="meses">Mês(s)</option>
            <option value="dias">Dia(s)</option>
          </select>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn-calc" onclick="calcular()">Calcular</button>
        <button class="btn-clear" onclick="limpar()">Limpar</button>
      </div>

      <div id="result">
        <div>Valor Final Estimado:</div>
        <div class="res-val" id="total">R$ 0,00</div>
      </div>
    </div>

    <script>
      function calcular() {
        // Obter valores
        const p = parseFloat(document.getElementById("inicial").value) || 0;
        const jurosInput =
          parseFloat(document.getElementById("juros").value) / 100 || 0;
        const tipoJuros = document.getElementById("tipoJuros").value;
        const iAnual =
          parseFloat(document.getElementById("inflacao").value) / 100 || 0;
        const aporteInicial =
          parseFloat(document.getElementById("aporte").value) || 0;
        const tempoInput =
          parseInt(document.getElementById("tempo").value) || 0;
        const tipoTempo = document.getElementById("tipoTempo").value;

        // 1. Padronizar o Tempo para MESES (base para o aporte mensal)
        let totalMeses = 0;
        if (tipoTempo === "anos") totalMeses = tempoInput * 12;
        else if (tipoTempo === "meses") totalMeses = tempoInput;
        else if (tipoTempo === "dias") totalMeses = tempoInput / 30;

        // 2. Padronizar a Taxa de Juros para MENSAL
        let taxaMensal = 0;
        if (tipoJuros === "anual")
          taxaMensal = Math.pow(1 + jurosInput, 1 / 12) - 1;
        else if (tipoJuros === "mensal") taxaMensal = jurosInput;
        else if (tipoJuros === "diario")
          taxaMensal = Math.pow(1 + jurosInput, 30) - 1;

        // 3. Inflação Mensal
        const inflacaoMensal = Math.pow(1 + iAnual, 1 / 12) - 1;

        // 4. Cálculo mês a mês
        let saldo = p;
        let aporteAtual = aporteInicial;

        // Usamos Math.ceil para garantir que dias quebrados contem como um ciclo
        const ciclos = Math.ceil(totalMeses);

        for (let i = 1; i <= ciclos; i++) {
          saldo *= 1 + taxaMensal;
          saldo += aporteAtual;
          aporteAtual *= 1 + inflacaoMensal;
        }

        // Exibir Resultado
        document.getElementById("result").style.display = "block";
        document.getElementById("total").innerText = saldo.toLocaleString(
          "pt-br",
          { style: "currency", currency: "BRL" },
        );
      }

      function limpar() {
        document.querySelectorAll("input").forEach((input) => {
          if (input.id === "tempo") input.value = "1";
          else input.value = "";
        });
        document.getElementById("result").style.display = "none";
        document.getElementById("tipoJuros").value = "anual";
        document.getElementById("tipoTempo").value = "anos";
      }
    </script>
  </body>
</html>
